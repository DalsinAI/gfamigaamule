# What this port builds on: fetched at build time, never shipped.
# Git sources are pinned by commit, tarballs by sha256.
AMULE_GIT=https://github.com/amule-project/amule.git
AMULE_TAG=3.0.0
AMULE_COMMIT=1791d2b8d3b60d16c9d2f32a9eadf456683c26cf
CRYPTOPP_GIT=https://github.com/weidai11/cryptopp.git
CRYPTOPP_TAG=CRYPTOPP_8_9_0
CRYPTOPP_COMMIT=843d74c7c97f9e19a615b8ff3c0ca06599ca501b
# Boost: the project's shared GFOpenBoost SDK (headers with the Amiga
# config; libboost_asio.a with Asio's separate compilation and its reactor
# on event.library)
GFOPENBOOST_VERSION=1.89.0
GFOPENBOOST_URL=https://github.com/DalsinAI/gfopenboost/releases/download/v1.89.0-rc2/gfopenboost-1.89.0-sdk.tar.xz
GFOPENBOOST_SHA256=b00ac87dbb84899593c5f74e45ddd38f6706a10964435517c1a04fd265286c5f
# The toolkit: GFOpenWX Toolkit at the commit with wxWebRequest on libcurl
# (gfopenwxtoolkit #23), built from source until a release has it; an
# SDK release goes in WXT_SDK_URL and WXT_SDK_SHA256 again then
WXT_REPO=https://github.com/DalsinAI/gfopenwxtoolkit
WXT_COMMIT=3f2f2f6105e3936c7b6194c84bcd46cd76a5e666
WXT_SDK_URL=
WXT_SDK_SHA256=
# event.library (GFOpenEvent 1.1 RC2), which GFOpenBoost's Asio reactor
# opens: the package carries it and Install-aMule puts it in LIBS:
GFOPENEVENT_URL=https://github.com/DalsinAI/gfopenevent/releases/download/v1.1-rc2/GFOpenEvent-1.1-rc2.zip
GFOPENEVENT_SHA256=3bbb04429ecc850982b6cbcaf9ba629a06d914b6b951d6b69cd66c33c36c8ca7
# Lab only: where the build fetches server.met and nodes.dat for the
# connect test (nothing of it is packaged)
LAB_LISTS=http://upd.emule-security.org
# regex.library (GFOpenRegex 1.0 RC1), the toolkit's wxRegEx engine:
# the package carries it and Install-aMule puts it in LIBS:
GFOPENREGEX_URL=https://github.com/DalsinAI/gfopenregex/releases/download/v1.0-rc1/GFOpenRegex-1.0-rc1.zip
GFOPENREGEX_SHA256=d596e9135be7407bd2f5baf7f6798da2e873125e120793ce190c0d4455ddb808
